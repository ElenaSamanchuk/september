<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <div class="container">
        <div class="q-img">
            <img src="./img/4q.webp" alt="question">
        </div>
        <div class="q-content">
            <div class="q-text">
                <p class="q-h1">Назови фигуру:</p>
                <p class="q-h2">Курьер привозит ПриЕм в&nbsp;коробках. Как правильно называется форма коробки?</p>
            </div>
            <div class="q-container">
                <label class="q-question"><input type="radio" name="options" id="4.1"><span>Прямоугольный параллелепипед</span></label>
                <label class="q-question"><input type="radio" name="options" id="4.2"><span>Квадратная трапеция</span></label>
                <label class="q-question"><input type="radio" name="options" id="4.3"><span>Ромбовидный квадрат</span></label>
            </div>
            <div class="q-bottom">
                <div class="q-range">
                    <span>4 из&nbsp;5</span>
                    <progress value="0.8"></progress>
                </div>
                <div class="q-btn">Легко!</div>
            </div>
        </div>
    </div>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            function getSelectedRadioId() {
                const selectedRadio = document.querySelector('input[name="options"]:checked');
                return selectedRadio ? selectedRadio.id : null;
            }
            document.querySelector('.q-btn').addEventListener('click', () => {
                const selectedId = getSelectedRadioId();
                if (selectedId) {
                    localStorage.setItem('4', selectedId);
                    console.log(localStorage.getItem('1'));
                    console.log(localStorage.getItem('2'));
                    console.log(localStorage.getItem('3'));
                    console.log(localStorage.getItem('4'));
                    location.href = './index5.html';
                } else {
                    alert('Ответь на вопрос');
                }
            });
        });
    </script>
    <script src="./script.js"></script>
</body>

</html>
