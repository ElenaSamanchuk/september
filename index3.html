<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <div class="container">
        <div class="q-img">
            <img src="./img/3q.webp" alt="question">
        </div>
        <div class="q-content">
            <div class="q-text">
                <p class="q-h1">Назови первый город, в&nbsp;котором появился ПриЕм:</p>
                <p class="q-h2">Этот город-миллионник находится на&nbsp;Северо-Западе России. Он знаменит разводными мостами, каналами и&nbsp;пышками.</p>
            </div>
            <div class="q-container">
                <label class="q-question"><input type="radio" name="options" id="3.1"><span>Москва</span></label>
                <label class="q-question"><input type="radio" name="options" id="3.2"><span>Санкт-Петербург</span></label>
                <label class="q-question"><input type="radio" name="options" id="3.3"><span>Казань</span></label>
            </div>
            <div class="q-bottom">
                <div class="q-range">
                    <span>3 из 5</span>
                    <progress value="0.6"></progress>
                </div>
                <div class="q-btn">Легко!</div>
            </div>
        </div>
    </div>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            function getSelectedRadioId() {
                const selectedRadio = document.querySelector('input[name="options"]:checked');
                return selectedRadio ? selectedRadio.id : null;
            }
            document.querySelector('.q-btn').addEventListener('click', () => {
                const selectedId = getSelectedRadioId();
                if (selectedId) {
                    localStorage.setItem('3', selectedId);
                    console.log(localStorage.getItem('1'));
                    console.log(localStorage.getItem('2'));
                    console.log(localStorage.getItem('3'));
                    location.href = './index4.html';
                } else {
                    alert('Ответь на вопрос');
                }
            });
        });
    </script>
    <script src="./script.js"></script>
</body>

</html>
